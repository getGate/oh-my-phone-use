<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Oh My Phone Use — Live Call</title>
<style>body{font:17px system-ui;max-width:680px;margin:60px auto;padding:24px;background:#f7f7f5;color:#222}button{font:inherit;padding:12px 20px;border-radius:12px;border:1px solid #ccc;margin:8px 8px 8px 0;background:white}#end{color:#b22}p{line-height:1.6}article{background:white;border-radius:16px;padding:20px;margin-top:20px}small{color:#666}</style>
<h1>Live Call</h1><p id="state">Connecting…</p><button id="listen">Start listening</button><button id="end">End call</button><p><small>Listen to both sides of the call. Your microphone stays off. Transcripts may be inaccurate.</small></p><div id="turns"></div>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let ctx=null,cursor=-1,active=false,times={},lastCall=null;
async function api(path,options={}){let r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Connection failed '+r.status);return r.json()}
document.querySelector('#listen').onclick=async()=>{if(!active){ctx ||= new AudioContext();await ctx.resume();cursor=-1;times={};active=true}else{active=false;await ctx.suspend()}document.querySelector('#listen').textContent=active?'Pause listening':'Start listening'};
document.querySelector('#end').onclick=async()=>{try{await api('/end',{method:'POST',body:JSON.stringify({call_id:lastCall})})}catch(e){document.querySelector('#state').textContent=e.message}};
async function poll(){try{const s=await api('/state');if(lastCall!==s.id){cursor=-1;times={};lastCall=s.id}document.querySelector('#state').textContent=({idle:'Waiting for a call',dialing:'Dialing',active:'Call in progress',ending:'Ending call',ended:'Call ended',failed:'Call failed'}[s.state]||s.state)+(s.error?' · '+s.error:'');
const container=document.querySelector('#turns');container.replaceChildren();for(const t of s.turns||[]){let a=document.createElement('article');for(const [label,value] of [['Agent',t.agent],['Other party',t.remote||'Waiting for a reply…']]){let p=document.createElement('p');p.textContent=label+': '+value;a.append(p)}container.append(a)}
if(active){let data=await api('/audio?'+cursor);cursor=data.cursor;for(const f of data.frames){let bytes=Uint8Array.from(atob(f.pcm),c=>c.charCodeAt(0));let view=new DataView(bytes.buffer);let b=ctx.createBuffer(1,bytes.length/2,8000),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=view.getInt16(i*2,true)/32768;let now=ctx.currentTime;if((times[f.side]||0)>now+.6)continue;let src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);let at=Math.max(now+.05,times[f.side]||0);src.start(at);times[f.side]=at+b.duration}}
}catch(e){document.querySelector('#state').textContent=e.message}setTimeout(poll,200)}poll();
</script></html>
